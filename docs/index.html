<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="个人简历与项目">
  <title>个人简历与项目</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./chat.css?v=follow-up-questions">
  <script defer src="./resume.js"></script>
  <script defer src="./render.js"></script>
  <script defer src="./chat-config.js"></script>
  <script defer src="./chat-marked.js"></script>
  <script defer src="./chat-markdown.js"></script>
  <script defer src="./chat-challenge.js"></script>
  <script defer src="./chat.js?v=follow-up-questions"></script>
  <script defer src="./motion/three-0.150.1.min.js"></script>
  <script defer src="./motion/fluid.js"></script>
  <script defer src="./motion/particles.js"></script>
  <script defer src="./motion/gradient-ascii.js"></script>
  <script defer src="./motion/poster-points.js"></script>
  <script defer src="./motion/motion-canvas.js"></script>
  <script defer src="./motion/motion.js"></script>
</head>
<body data-view="portfolio">
  <div class="motion-surface" aria-hidden="true">
    <canvas class="gradient-ascii"></canvas>
    <canvas class="particle-canvas" id="particles-webgl"></canvas>
    <canvas class="particle-canvas" id="particles-canvas"></canvas>
  </div>
  <p id="load-message" class="load-message" role="status">正在加载简历。请确认 resume.js 和 render.js 与此页面位于同一目录，且浏览器已启用 JavaScript。</p>
  <a id="skip" class="skip" href="#profile" hidden></a>
  <header id="site-head" class="site-head" hidden>
    <a class="brand" href="#profile"></a>
    <div class="head-actions">
      <button class="motion-toggle" id="motion-toggle" type="button" hidden></button>
      <a class="print-link" href="./resume.html"></a>
    </div>
  </header>
  <main class="layout" hidden>
    <section class="work" id="work" aria-labelledby="work-title" tabindex="-1" hidden>
      <h2 class="label" id="work-title"></h2>
      <div class="filters" role="group" hidden></div>
      <p id="filter-status" class="sr-only" role="status"></p>
      <div class="project-scroll" role="region" tabindex="0"></div>
    </section>
    <div class="profile-panel">
      <nav class="profile-nav"></nav>
      <div class="profile-scroll" role="region" tabindex="0"></div>
    </div>
  </main>
  <section class="chat-answer-region" id="chat-answer-region" aria-label="AI 回答" hidden>
    <div class="chat-answer-output" id="chat-answer-output" tabindex="0">
      <div class="chat-answer-draft" id="chat-answer-draft"></div>
      <div class="chat-answer-markdown" id="chat-answer-markdown" hidden></div>
      <div class="chat-follow-ups" id="chat-follow-ups" role="group" aria-labelledby="chat-follow-ups-label" hidden></div>
    </div>
  </section>
  <footer class="chat-footer" id="chat-footer" aria-label="AI 问答" hidden>
    <form class="chat-entry" id="chat-entry">
      <div class="chat-feedback">
        <div class="chat-challenge" id="chat-challenge" hidden></div>
        <p class="chat-status" id="chat-status" role="status">问答服务尚未接入。</p>
      </div>
      <div class="chat-compose">
        <span class="chat-compose-ai" aria-hidden="true">AI</span>
        <label class="sr-only" id="chat-input-label" for="chat-input">询问项目或经历</label>
        <input id="chat-input" type="text" placeholder="询问项目或经历" aria-describedby="chat-status" maxlength="1500" enterkeyhint="send" autocomplete="off" required disabled>
        <button class="chat-icon" id="chat-clear" type="button" aria-label="关闭回答" hidden>×</button>
        <button class="chat-icon chat-stop" id="chat-stop" type="button" aria-label="停止回答" hidden>■</button>
        <button class="chat-icon chat-send" id="chat-send" type="submit" aria-label="发送" disabled>↑</button>
      </div>
    </form>
    <p class="sr-only" id="chat-announcement" role="status"></p>
  </footer>
</body>
</html>
